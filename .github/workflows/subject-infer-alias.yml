name: subject-infer alias

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: overlay tests
        working-directory: overlays/subject-infer-alias
        run: bun test reapply.test.ts
