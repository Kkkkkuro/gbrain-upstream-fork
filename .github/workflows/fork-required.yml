name: Fork required

# Required checks for Kkkkkuro/gbrain-upstream-fork.
# Upstream workflows stay on garrytan/gbrain and skip here.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fork-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    if: github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: rhysd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8  # v1.7.11

  semgrep:
    if: github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Semgrep scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$BASE_SHA" ]; then
            BASELINE="$(git merge-base "$BASE_SHA" HEAD || echo "$BASE_SHA")"
            echo "PR scan — failing only on findings new since $BASELINE"
            semgrep scan --config p/default --config p/typescript --error --baseline-commit "$BASELINE"
          else
            echo "Full-tree scan — report-only"
            semgrep scan --config p/default --config p/typescript || true
          fi

  gitleaks:
    if: github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -fsSL -o "/tmp/${BASE}" "${URL}/${BASE}"
          curl -fsSL -o /tmp/gitleaks_checksums.txt "${URL}/gitleaks_${VER}_checksums.txt"
          ( cd /tmp && grep " ${BASE}\$" /tmp/gitleaks_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${BASE}" -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Verify scanner detects secrets outside exact fixture exceptions
        run: bash scripts/test-gitleaks-config.sh
      - name: Scan for secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks detect --redact --no-banner --log-opts "$RANGE"

  overlay-reapply:
    if: github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - name: Run overlay reapply tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(overlays/*/reapply.test.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no overlay reapply tests on this branch"
            exit 0
          fi
          for file in "${files[@]}"; do
            dir="$(dirname "$file")"
            echo "bun test $file"
            (cd "$dir" && bun test reapply.test.ts)
          done

  unit:
    if: github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run unit shard ${{ matrix.shard }}/8
        run: bash scripts/test-shard.sh ${{ matrix.shard }} 8

  fork-required:
    if: always() && github.repository == 'Kkkkkuro/gbrain-upstream-fork'
    needs: [actionlint, semgrep, gitleaks, overlay-reapply, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          ACTIONLINT: ${{ needs.actionlint.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          OVERLAY: ${{ needs.overlay-reapply.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          set -eu
          fail=0
          for name in ACTIONLINT SEMGREP GITLEAKS OVERLAY UNIT; do
            value="${!name}"
            echo "$name=$value"
            if [ "$value" != "success" ]; then
              echo "::error::$name is $value"
              fail=1
            fi
          done
          exit "$fail"
